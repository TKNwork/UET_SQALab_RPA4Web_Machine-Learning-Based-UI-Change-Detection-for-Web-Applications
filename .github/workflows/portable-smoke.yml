name: Portable matching
on: [push, pull_request, workflow_dispatch]
jobs:
  matching:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/matching.txt
      - run: python run.py doctor
      - run: python run.py smoke
      - run: python run.py test
